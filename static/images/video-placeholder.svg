      <stop offset="0" stop-color="#12231d"/>
      <stop offset="1" stop-color="#315e4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="20%" r="80%">
      <stop offset="0" stop-color="#d9b77c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d9b77c" stop-opacity="0"/>
