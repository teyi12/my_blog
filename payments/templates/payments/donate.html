{% extends 'template_base.html' %}
{% load i18n %}
{% block titre %}{% translate "Faire un don" %}{% endblock %}
{% block contenu %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">
          <h3 class="fw-bold mb-3">💖 Soutenir le projet</h3>
          <p class="text-muted">{% translate "Choisissez un montant en euros." %}</p>
          <form method="post" action="{% url 'payments:create_donation_checkout' %}">
            {% csrf_token %}
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label">{% translate "Montant (€)" %}</label>
                <input type="number" min="1" step="0.01" value="5.00" name="amount" class="form-control" required>
              </div>
            </div>
            <button class="btn btn-success w-100 mt-3"><i class="bi bi-credit-card"></i> {% translate "Faire un don" %}</button>
          </form>
          <a href="{% url 'payments:choice' %}" class="btn btn-outline-secondary w-100 mt-2">⬅ Retour</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
