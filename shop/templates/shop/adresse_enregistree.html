{% extends "template_base.html" %}

{% block titre %}Adresse enregistrée{% endblock %}

{% block contenu %}
<div class="container text-center my-5">
    <div class="alert alert-success shadow-sm p-4 rounded-3">
        <h3 class="mb-3">✅ Adresse enregistrée avec succès !</h3>
        <p>Vous allez être redirigé vers la page de paiement dans quelques secondes...</p>
        <a href="{% url 'payments:choice' %}" class="btn btn-primary mt-3">
            Continuer vers le paiement
        </a>
    </div>
</div>

<script>
    setTimeout(function() {
        window.location.href = "{% url 'payments:choice' %}";
    }, 3000); // 3 secondes avant la redirection
</script>
{% endblock %}
